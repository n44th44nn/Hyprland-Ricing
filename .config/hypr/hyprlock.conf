# ==============================================================================
# Gruvbox Material Hyprlock Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# BACKGROUND
# ------------------------------------------------------------------------------
background {
    monitor =
    # Point directly to your active wallpaper or screenshot:
    # If you use a static path, put it here (e.g., ~/.config/hypr/wallpaper.png)
    # Alternatively, screenshot mode with strong blur gives a cohesive frosted look:
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ------------------------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------------------------
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# ------------------------------------------------------------------------------
# INPUT FIELD (Gruvbox Pill)
# ------------------------------------------------------------------------------
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding

    # Gruvbox Colors: #1d2021 (bg), #d4be98 (fg), #7daea3 (accent blue/aqua)
    outer_color = rgba(125, 174, 163, 0.8)
    inner_color = rgba(29, 32, 33, 0.85)
    font_color = rgb(212, 190, 152)
    fade_on_empty = false
    placeholder_text = <span foreground="##a89984"><i>Input Password...</i></span>
    hide_input = false
    rounding = 24
    check_color = rgb(216, 166, 87) # Gruvbox Yellow
    fail_color = rgb(234, 105, 98)   # Gruvbox Red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300

    position = 0, -120
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# TIME (CLOCK)
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(212, 190, 152) # Gruvbox fg (#d4be98)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# DATE
# ------------------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgb(168, 153, 132) # Gruvbox gray (#a89984)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 65
    halign = center
    valign = center
}

# ------------------------------------------------------------------------------
# USER GREETING
# ------------------------------------------------------------------------------
label {
    monitor =
    text = Hi there, $USER
    color = rgb(212, 190, 152)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
