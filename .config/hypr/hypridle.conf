general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid launching multiple instances
    before_sleep_cmd = loginctl lock-session    # Lock screen before suspend/sleep
    after_sleep_cmd = hyprctl dispatch dpms on  # Wake up monitor on resume
}

# Optional: Dim screen after 2.5 minutes of inactivity
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10        # Save and drop brightness
    on-resume = brightnessctl -r                # Restore brightness on input
}

# Lock screen after 3 minutes of inactivity
listener {
    timeout = 180
    on-timeout = loginctl lock-session
}

Turn off display after 4.5 minutes of inactivity
listener {
    timeout = 270
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

